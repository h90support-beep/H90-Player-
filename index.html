<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>H90 Player</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="H90player.png" type="image/png">
<link rel="apple-touch-icon" href="H90player.png">
<link rel="stylesheet" href="player.css">
</head>
<body>

<!-- ================================================================
     🏠 شاشة البداية
     ================================================================ -->
<div id="welcomeScreen">
  <div class="welcome-content">
    
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <polygon points="6 3 20 12 6 21 6 3"/>
      </svg>
    </div>
    
    <h1 class="welcome-title">H90 Player</h1>
    <p class="welcome-subtitle">مشغل الفيديو الخاص بـ H90</p>
    
    <div class="welcome-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      <span>افتح أي فيلم من تطبيق H90 لبدء التشغيل</span>
    </div>

    <div class="welcome-features">
      <div class="feature-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3h6v2H5v4H3V3zM15 3h6v6h-2V5h-4V3zM21 15v6h-6v-2h4v-4h2zM3 15h2v4h4v2H3v-6z"/>
        </svg>
        <span>ملء الشاشة</span>
      </div>
      <div class="feature-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <span>الصوت</span>
      </div>
      <div class="feature-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
        </svg>
        <span>الإضاءة</span>
      </div>
    </div>

  </div>
</div>


<!-- ================================================================
     ▶️ شاشة المشغل
     ================================================================ -->
<div id="playerScreen">

  <!-- الفيديو -->
  <video id="videoPlayer" playsinline webkit-playsinline preload="metadata"></video>

  <!-- شاشة التحميل -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">جارٍ التحميل...</div>
  </div>

  <!-- قفل الشاشة overlay -->
  <div class="lock-overlay" id="lockOverlay">
    <button class="unlock-btn" id="unlockBtn" aria-label="فتح القفل">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </button>
  </div>

  <!-- مؤشر الصوت -->
  <div class="gesture-indicator" id="volumeIndicator">
    <div class="gesture-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </div>
    <div class="gesture-bar">
      <div class="gesture-fill" id="volumeFill"></div>
    </div>
    <div class="gesture-value" id="volumeValue">50%</div>
  </div>

  <!-- مؤشر الإضاءة -->
  <div class="gesture-indicator" id="brightnessIndicator">
    <div class="gesture-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
      </svg>
    </div>
    <div class="gesture-bar">
      <div class="gesture-fill brightness-fill" id="brightnessFill"></div>
    </div>
    <div class="gesture-value" id="brightnessValue">100%</div>
  </div>

  <!-- مؤشر التقديم -->
  <div class="seek-indicator" id="seekIndicator">
    <div class="seek-icon" id="seekIcon"></div>
    <div class="seek-text" id="seekText">+10 ثانية</div>
  </div>

  <!-- مؤشر لقطة الشاشة -->
  <div class="toast-indicator" id="toastIndicator">
    <div class="toast-icon" id="toastIcon"></div>
    <div class="toast-text" id="toastText">تم الحفظ</div>
  </div>


  <!-- ═══════════════════════════════════════════════════════
       الشريط العلوي
       ═══════════════════════════════════════════════════════ -->
  <div class="player-header" id="playerHeader">
    
    <!-- رجوع -->
    <button class="player-btn" id="backBtn" aria-label="رجوع">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <!-- العنوان -->
    <div class="player-title" id="playerTitle">H90 Player</div>

    <!-- قفل -->
    <button class="player-btn" id="lockBtn" aria-label="قفل الشاشة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
      </svg>
    </button>

    <!-- معلومات -->
    <button class="player-btn" id="infoBtn" aria-label="معلومات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
    </button>

  </div>


  <!-- ═══════════════════════════════════════════════════════
       الشريط السفلي
       ═══════════════════════════════════════════════════════ -->
  <div class="player-controls" id="playerControls">

    <!-- شريط التقدم -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-track">
        <div class="progress-buffer" id="progressBuffer"></div>
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
    </div>

    <!-- الأوقات -->
    <div class="times">
      <span id="currentTime">0:00</span>
      <span class="time-sep">/</span>
      <span id="duration">--:--</span>
    </div>

    <!-- الأزرار الرئيسية -->
    <div class="buttons-main">

      <!-- السابق -->
      <button class="ctrl-btn" id="prevBtn" aria-label="السابق">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <polygon points="19 20 9 12 19 4 19 20"/>
          <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>

      <!-- رجوع 10 ثواني -->
      <button class="ctrl-btn" id="seekBackBtn" aria-label="رجوع 10">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          <text x="12" y="17" text-anchor="middle" font-size="7" fill="currentColor" stroke="none" font-weight="700">10</text>
        </svg>
      </button>

      <!-- تشغيل -->
      <button class="ctrl-btn ctrl-play" id="playBtn" aria-label="تشغيل">
        <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon">
          <polygon points="6 3 20 12 6 21 6 3"/>
        </svg>
      </button>

      <!-- تقديم 10 ثواني -->
      <button class="ctrl-btn" id="seekFwdBtn" aria-label="تقديم 10">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          <text x="12" y="17" text-anchor="middle" font-size="7" fill="currentColor" stroke="none" font-weight="700">10</text>
        </svg>
      </button>

      <!-- التالي -->
      <button class="ctrl-btn" id="nextBtn" aria-label="التالي">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 4 15 12 5 20 5 4"/>
          <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>

      <!-- كتم -->
      <button class="ctrl-btn" id="muteBtn" aria-label="كتم">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="volumeIcon">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </button>

      <!-- سرعة -->
      <button class="ctrl-btn" id="speedBtn" aria-label="السرعة">
        <span class="speed-label" id="speedLabel">1x</span>
      </button>

      <!-- ملء الشاشة -->
      <button class="ctrl-btn" id="fullscreenBtn" aria-label="ملء الشاشة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="fullscreenIcon">
          <path d="M3 3h6v2H5v4H3V3zM15 3h6v6h-2V5h-4V3zM21 15v6h-6v-2h4v-4h2zM3 15h2v4h4v2H3v-6z"/>
        </svg>
      </button>

    </div>

    <!-- الأزرار الثانوية (أدوات) -->
    <div class="buttons-tools">

      <!-- نسبة العرض -->
      <button class="tool-btn" id="aspectBtn" aria-label="نسبة العرض">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="M2 12h20"/>
          <text x="12" y="19" text-anchor="middle" font-size="6" fill="currentColor" stroke="none" font-weight="700" id="aspectLabel">FIT</text>
        </svg>
      </button>

      <!-- لقطة -->
      <button class="tool-btn" id="screenshotBtn" aria-label="لقطة شاشة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>

      <!-- ترجمة -->
      <button class="tool-btn" id="subtitleBtn" aria-label="ترجمة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <line x1="6" y1="14" x2="11" y2="14"/>
          <line x1="6" y1="18" x2="14" y2="18"/>
          <line x1="13" y1="14" x2="18" y2="14"/>
          <line x1="16" y1="18" x2="18" y2="18"/>
        </svg>
      </button>

      <!-- مؤقت النوم -->
      <button class="tool-btn" id="sleepBtn" aria-label="مؤقت النوم">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

    </div>

  </div>


  <!-- ═══════════════════════════════════════════════════════
       قائمة نسبة العرض
       ═══════════════════════════════════════════════════════ -->
  <div class="popup-menu" id="aspectMenu">
    <div class="popup-title">نسبة العرض</div>
    <button class="popup-item active" data-aspect="fit">
      <span>ملء الشاشة مع الحواف</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-aspect="cover">
      <span>ملء الشاشة بدون حواف</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-aspect="fill">
      <span>تمدد</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-aspect="16:9">
      <span>16:9</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-aspect="4:3">
      <span>4:3</span>
      <span class="popup-check">✓</span>
    </button>
  </div>


  <!-- ═══════════════════════════════════════════════════════
       قائمة مؤقت النوم
       ═══════════════════════════════════════════════════════ -->
  <div class="popup-menu" id="sleepMenu">
    <div class="popup-title">مؤقت النوم</div>
    <button class="popup-item" data-minutes="0">
      <span>إيقاف</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-minutes="10">
      <span>10 دقائق</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-minutes="20">
      <span>20 دقيقة</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-minutes="30">
      <span>30 دقيقة</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-minutes="45">
      <span>45 دقيقة</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-minutes="60">
      <span>ساعة</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-minutes="90">
      <span>ساعة ونصف</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-minutes="120">
      <span>ساعتان</span>
      <span class="popup-check">✓</span>
    </button>
  </div>


  <!-- ═══════════════════════════════════════════════════════
       قائمة السرعة
       ═══════════════════════════════════════════════════════ -->
  <div class="popup-menu" id="speedMenu">
    <div class="popup-title">سرعة التشغيل</div>
    <button class="popup-item active" data-speed="1">
      <span>1x (عادي)</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-speed="0.5">
      <span>0.5x (بطيء)</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-speed="0.75">
      <span>0.75x</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-speed="1.25">
      <span>1.25x</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-speed="1.5">
      <span>1.5x (سريع)</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" data-speed="2">
      <span>2x (سريع جداً)</span>
      <span class="popup-check">✓</span>
    </button>
  </div>


  <!-- ═══════════════════════════════════════════════════════
       قائمة الترجمة
       ═══════════════════════════════════════════════════════ -->
  <div class="popup-menu" id="subtitleMenu">
    <div class="popup-title">الترجمة</div>
    <button class="popup-item active" data-sub="none">
      <span>بدون ترجمة</span>
      <span class="popup-check">✓</span>
    </button>
    <button class="popup-item" id="loadSubBtn">
      <span>تحميل ملف (SRT / VTT)</span>
      <span class="popup-check">↗</span>
    </button>
    <div class="popup-tracks" id="subtitleTracks"></div>
  </div>


  <!-- ═══════════════════════════════════════════════════════
       مؤقت النوم النشط (عرض صغير)
       ═══════════════════════════════════════════════════════ -->
  <div class="active-timer" id="activeTimer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <span id="activeTimerText">30:00</span>
  </div>


  <!-- ═══════════════════════════════════════════════════════
       Overlay إغلاق القوائم (شفاف)
       ═══════════════════════════════════════════════════════ -->
  <div class="popup-overlay" id="popupOverlay"></div>

</div>


<!-- ═══════════════════════════════════════════════════════════
     Input مخفي لتحميل الترجمة
     ═══════════════════════════════════════════════════════════ -->
<input type="file" id="subtitleFile" accept=".srt,.vtt" style="display:none;">


<!-- ═══════════════════════════════════════════════════════════
     مكتبات Capacitor
     ═══════════════════════════════════════════════════════════ -->
<script src="https://unpkg.com/@capacitor/core@6/dist/capacitor.js"></script>

<!-- كود المشغل -->
<script src="player.js"></script>

</body>
</html>
